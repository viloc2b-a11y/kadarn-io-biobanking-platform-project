name: KPO Governance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Validate Work Order contracts
        run: python scripts/kpo_validate.py --root . --mode required
      - name: Test validator
        run: python -m unittest discover -s tests/kpo -p "test_*.py"
