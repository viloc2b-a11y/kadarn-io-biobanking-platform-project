design_decisions:
  - id: D12
    decision: "Migration split into 095 (ALTER evidence_sources) + 096 (CREATE 7 new tables)"
    rationale: "ALTER-only migration is reversible; new tables can be created independently."

  - id: D13
    decision: "Existing evidence_sources rows default to sensitivity='unknown', expiration='expiration_unknown'"
    rationale: "Cannot assume safety of pre-existing documents. All require manual review."

  - id: D14
    decision: "Retention policies are versioned with superseded_by chain; existing assignments are NOT auto-updated"
    rationale: "Policy changes should not retroactively alter destruction schedules without review."

  - id: D15
    decision: "DOCUMENT_TAXONOMY is a database table with seed data, not a hardcoded TypeScript constant"
    rationale: "Taxonomy must be updatable without code deployment. Clients read from DB."

