corrections_applied:
  - id: C1
    issue: "private_restricted aparecía como elegible para paquetes"
    fix: "Separado vaultEligible de packageHandlingEligible. private_restricted bloquea explícitamente paquetes con mensaje de error."

  - id: C2
    issue: "computeValidityStatus() no manejaba periodic_review_required ni valid_until_replaced"
    fix: "Función refactorizada con objeto de contexto. Maneja las 5 clasificaciones. expires_on_date valida que expirationDate exista."

  - id: C3
    issue: "isExpirationValidForPackage() tenía semántica insuficiente"
    fix: "Renombrada a isExpirationClassificationResolvable(). La validez real se determina en computeValidityStatus() + computePackageEligibility()."

  - id: C4
    issue: "is_package_eligible booleano no distinguía propósitos"
    fix: "Reemplazado por PackagePurpose[] (feasibility|site_qualification|study_startup|study_assignment|internal_evidence). computeEligiblePurposes() determina qué propósitos aplican."

  - id: C5
    issue: "La autorización no se evaluaba dentro de Package Eligibility"
    fix: "Creado TransferEligibility con tres booleanos separados: documentEligible, packageEligible, transferAuthorized. computeTransferEligibility() recibe la autorización."

  - id: C6
    issue: "pii_detected requería transición post-redacción"
    fix: "Definida PIIRedactionTransition: original_sensitivity → processed_sensitivity + redaction_status + deidentification_method. Flujo documentado en §2.2."

  - id: C7
    issue: "Taxonomía incompleta (13 tipos vs. 22 requeridos)"
    fix: "Ampliada a 22 tipos: cv, gcp, iata, human_subjects_protection, medical_license, board_certification, acls_bls, study_specific_training, clia, cap, institutional_license, pharmacy_license, controlled_substance, irb_reliance, facility_certification, insurance, sop, equipment_calibration, equipment_maintenance, equipment_qualification, temperature_mapping, shipping_validation + prohibited + unclassified."

  - id: C8
    issue: "Posible duplicación de estado entre columnas y tablas normalizadas"
    fix: "Single Authority Rule en §2.1: evidencia derivable por query NO debe ser columna. Sin is_package_eligible, is_authorized, is_on_legal_hold en evidence_sources."

