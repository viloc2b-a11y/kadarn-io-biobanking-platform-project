design_decisions:
  - id: D1
    decision: "reject belongs in IntakeDisposition, not DocumentHandlingMode"
    rationale: "Rejection is an admission decision, not a treatment modality. Mixing dimensions caused the same problem as Claims states."

  - id: D2
    decision: "Retention duration resolved via policy lookup, not hardcoded"
    rationale: "Different jurisdictions, contracts, and document types require different retention periods."

  - id: D3
    decision: "PHI/PII detection must occur BEFORE extraction or embedding"
    rationale: "Current pipeline sends text to OpenAI embeddings before any sensitivity check."

  - id: D4
    decision: "unknown sensitivity must trigger quarantine, not default processing"
    rationale: "Unclassified documents cannot be assumed safe."

  - id: D5
    decision: "Destruction must cascade to chunks, embeddings, previews, caches, and backups"
    rationale: "Deleting only the PDF while embeddings persist is not complete destruction."

  - id: D6
    decision: "Backend enforcement must precede UI"
    rationale: "UI warnings that users can ignore do not constitute security controls."

  - id: D7
    decision: "KADARN must not auto-claim Safe Harbor or Expert Determination compliance"
    rationale: "De-identification requires qualified assessment; pattern detection alone is insufficient."

