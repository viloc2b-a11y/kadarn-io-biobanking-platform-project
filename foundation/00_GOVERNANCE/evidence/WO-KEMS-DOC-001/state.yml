design_decisions:
  - id: D1
    decision: "reject belongs in IntakeDisposition, not DocumentHandlingMode"
    rationale: "Rejection is an admission decision, not a treatment modality."

  - id: D2
    decision: "Retention duration resolved via policy lookup, not hardcoded"
    rationale: "Different jurisdictions, contracts, and document types require different retention periods."

  - id: D3
    decision: "PHI/PII detection must occur BEFORE extraction or embedding"
    rationale: "Current pipeline sends text to OpenAI embeddings before any sensitivity check."

  - id: D4
    decision: "unknown sensitivity must trigger quarantine, not default processing"
    rationale: "Unclassified documents cannot be assumed safe."

  - id: D5
    decision: "Destruction must cascade to chunks, embeddings, previews, caches, and backups"
    rationale: "Deleting only the PDF while embeddings persist is not complete destruction."

  - id: D6
    decision: "Backend enforcement must precede UI"
    rationale: "UI warnings that users can ignore do not constitute security controls."

  - id: D7
    decision: "KADARN must not auto-claim Safe Harbor or Expert Determination compliance"
    rationale: "De-identification requires qualified assessment; pattern detection alone is insufficient."

  - id: D8
    decision: "Feasibility Folder was incorrectly defined — prioritized historical study docs over current credentials"
    rationale: "Activation letters, closeout letters, and sponsor correspondence are internal experience evidence, not default package items. The correct model is Site Qualification Document Vault + Study-Specific Package Generator."

  - id: D9
    decision: "Documents must be associated with entity hierarchy: Person→Role→Credential; Institution→Location→Equipment→Record"
    rationale: "Association at institution-level only is insufficient for equipment calibrations, personnel credentials, and location-specific certifications."

  - id: D10
    decision: "Every document must have expiration classification: expires_on_date | periodic_review | valid_until_replaced | no_expiration | expiration_unknown"
    rationale: "expiration_unknown documents are ineligible for feasibility packages."

  - id: D11
    decision: "Feasibility packages are study-specific, not one-size-fits-all"
    rationale: "No sample collection → no IATA. Phase I → ACLS, pharmacy, temp monitoring. Controlled IP → additional licenses."

